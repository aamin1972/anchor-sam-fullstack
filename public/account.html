<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Anchor Sam</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 85% 10%, rgba(245, 189, 49, 0.08), transparent 28%),
      #080808;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  /* Header */
  .header {
    min-height: 74px;
    padding: 0 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(13, 13, 13, 0.96);
    border-bottom: 1px solid rgba(245, 189, 49, 0.18);
  }

  .logo {
    color: #f5bd31;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .home-btn {
    padding: 9px 16px;
    color: #f5bd31;
    border: 1px solid rgba(245, 189, 49, 0.45);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: 0.2s ease;
  }

  .home-btn:hover {
    background: #f5bd31;
    color: #111;
  }

  /* Main */
  .container {
    width: 90%;
    max-width: 1100px;
    margin: 45px auto 70px;
  }

  /* Welcome */
  .welcome {
    position: relative;
    overflow: hidden;
    margin-bottom: 25px;
    padding: 30px;
    background: linear-gradient(135deg, #171717, #0d0d0d);
    border: 1px solid rgba(245, 189, 49, 0.25);
    border-radius: 18px;
  }

  .welcome::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    right: -60px;
    top: -80px;
    background: rgba(245, 189, 49, 0.09);
    border-radius: 50%;
  }

  .welcome h1 {
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
    font-size: 32px;
  }

  .welcome p {
    position: relative;
    z-index: 1;
    color: #999;
  }

  /* Profile */
  .account-card {
    padding: 26px;
    background: linear-gradient(145deg, #151515, #0d0d0d);
    border: 1px solid rgba(245, 189, 49, 0.28);
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
  }

  .account-card h2 {
    margin-bottom: 20px;
    color: #f5bd31;
    font-size: 22px;
  }

  .info {
    padding: 15px 0;
    border-bottom: 1px solid #252525;
  }

  .info:last-child {
    border-bottom: none;
  }

  .info span {
    display: block;
    margin-bottom: 6px;
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .info strong {
    color: #f5f5f5;
    font-size: 16px;
  }

  /* Bookings */
  .bookings-section {
    margin-top: 35px;
  }

  .section-heading {
    margin-bottom: 18px;
  }

  .section-heading h2 {
    margin-bottom: 5px;
    color: #f5bd31;
    font-size: 26px;
  }

  .section-heading p {
    color: #888;
    font-size: 14px;
  }

  .bookings-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .booking-card {
    position: relative;
    overflow: hidden;
    padding: 22px;
    background: linear-gradient(145deg, #151515, #0c0c0c);
    border: 1px solid rgba(245, 189, 49, 0.25);
    border-radius: 16px;
    transition: 0.2s ease;
  }

  .booking-card:hover {
    transform: translateY(-3px);
    border-color: rgba(245, 189, 49, 0.55);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
  }

  .booking-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: #f5bd31;
  }

  .booking-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .booking-top h3 {
    font-size: 19px;
  }

  /* Status */
  .status-badge {
    flex-shrink: 0;
    padding: 7px 12px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .status-new {
    background: rgba(245, 189, 49, 0.14);
    border: 1px solid rgba(245, 189, 49, 0.3);
    color: #f5bd31;
  }

  .status-confirmed {
    background: rgba(46, 204, 113, 0.12);
    border: 1px solid rgba(46, 204, 113, 0.3);
    color: #52df8d;
  }

  .status-completed {
    background: rgba(52, 152, 219, 0.12);
    border: 1px solid rgba(52, 152, 219, 0.3);
    color: #65baf3;
  }

  .status-cancelled {
    background: rgba(231, 76, 60, 0.12);
    border: 1px solid rgba(231, 76, 60, 0.3);
    color: #ff7061;
  }

  /* Booking Details */
  .booking-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .booking-detail {
    padding: 12px;
    background: #0a0a0a;
    border: 1px solid #202020;
    border-radius: 9px;
  }

  .booking-detail span {
    display: block;
    margin-bottom: 5px;
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .booking-detail strong {
    color: #eee;
    font-size: 14px;
    word-break: break-word;
  }

  .loading-bookings,
  .no-bookings {
    padding: 20px;
    color: #888;
    background: #111;
    border: 1px dashed #333;
    border-radius: 12px;
  }

  /* Tablet */
  @media (max-width: 800px) {
    .bookings-grid {
      grid-template-columns: 1fr;
    }
  }

  /* Phone */
  @media (max-width: 600px) {
    .header {
      min-height: 64px;
      padding: 0 5%;
    }

    .logo {
      font-size: 18px;
    }

    .home-btn {
      padding: 7px 11px;
      font-size: 12px;
    }

    .container {
      width: 92%;
      margin: 25px auto 50px;
    }

    .welcome {
      padding: 22px 18px;
      border-radius: 14px;
    }

    .welcome h1 {
      max-width: 85%;
      font-size: 24px;
      line-height: 1.2;
    }

    .welcome p {
      font-size: 13px;
    }

    .account-card {
      padding: 20px 18px;
      border-radius: 14px;
    }

    .account-card h2 {
      font-size: 20px;
    }

    .section-heading h2 {
      font-size: 23px;
    }

    .booking-card {
      padding: 18px;
    }

    .booking-top {
      align-items: flex-start;
    }

    .booking-top h3 {
      font-size: 17px;
    }

    .status-badge {
      padding: 6px 9px;
      font-size: 10px;
    }

    .booking-details {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

  <header class="header">
    <div class="logo">ANCHOR SAM.</div>
    <a href="/" class="home-btn">Home</a>
  </header>

  <main class="container">

    <div class="welcome">
      <h1 id="welcomeName">My Account</h1>
      <p>Manage your Anchor Sam account</p>
    </div>

    <div class="account-card">
      <h2>Profile Information</h2>

      <div class="info">
        <span>Full Name</span>
        <strong id="userName">Loading...</strong>
      </div>

      <div class="info">
        <span>Email Address</span>
        <strong id="userEmail">Loading...</strong>
      </div>
    </div>

  <section class="bookings-section">
  <div class="section-heading">
    <div>
      <h2>My Bookings</h2>
      <p>Track your event booking status</p>
    </div>
  </div>

  <div id="myBookings" class="bookings-grid">
    <p class="loading-bookings">Loading your bookings...</p>
  </div>
</section>   

  </main>

  <script>
   
   async function loadMyBookings() {
  const container = document.getElementById("myBookings");

  try {
    const response = await fetch("/api/my-bookings");

    if (response.status === 401) {
      window.location.href = "/login.html";
      return;
    }

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Unable to load bookings");
    }

    container.innerHTML = "";

    if (data.bookings.length === 0) {
      const emptyMessage = document.createElement("p");
      emptyMessage.className = "no-bookings";
      emptyMessage.textContent = "You have no bookings yet.";
      container.appendChild(emptyMessage);
      return;
    }

    data.bookings.forEach((booking) => {
      const card = document.createElement("div");
      card.className = "booking-card";

      const top = document.createElement("div");
      top.className = "booking-top";

      const title = document.createElement("h3");
      title.textContent = booking.eventType || "Event";

      const status = document.createElement("span");
      const statusText = booking.status || "New";

      status.className =
        "status-badge status-" + statusText.toLowerCase();

      status.textContent = statusText;

      top.appendChild(title);
      top.appendChild(status);

      const details = document.createElement("div");
      details.className = "booking-details";
const items = [
  ["📅 Event Date", booking.eventDate || "-"],
  ["📍 Location", booking.location || "-"],
  ["📞 Phone", booking.phone || "-"],
  ["💬 Your Message", booking.message || "No message added"]
];

      items.forEach(([label, value]) => {
        const detail = document.createElement("div");
        detail.className = "booking-detail";

        const labelElement = document.createElement("span");
        labelElement.textContent = label;

        const valueElement = document.createElement("strong");
        valueElement.textContent = value;

        detail.appendChild(labelElement);
        detail.appendChild(valueElement);
        details.appendChild(detail);
      });

      card.appendChild(top);
      card.appendChild(details);
      container.appendChild(card);
    });

  } catch (error) {
    console.error("Bookings error:", error);
    container.textContent = "Unable to load your bookings.";
  }
}

    async function loadAccount() {
      try {
        const response = await fetch("/api/me");

        if (response.status === 401) {
          window.location.href = "/login.html";
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to load account");
        }

        document.getElementById("userName").textContent =
          data.user.fullName;

        document.getElementById("userEmail").textContent =
          data.user.email;

        document.getElementById("welcomeName").textContent =
          `Welcome, ${data.user.fullName}`;

      } catch (error) {
        console.error(error);
      }
    }

    loadAccount();
    loadMyBookings();
  </script>

</body>
</html>
