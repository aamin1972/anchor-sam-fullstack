<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anchor Sam | Admin Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */

    .header {
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #f5bd31;
    }

    .logout-btn {
      background: #f5bd31;
      color: #111;
      border: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MAIN */

    .container {
      width: 90%;
      max-width: 1300px;
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome h1 span {
      color: #f5bd31;
    }

    .welcome p {
      color: #aaa;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      padding: 25px;
      border-radius: 14px;
    }

    .card p {
      color: #aaa;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f5bd31;
      font-size: 32px;
    }

    /* BOOKINGS */

    .booking-section {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
    }

    .booking-header {
      padding: 25px;
      border-bottom: 1px solid #292929;
    }

    .booking-header h2 {
      font-size: 22px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: 18px;
      border-bottom: 1px solid #292929;
    }

    th {
      color: #f5bd31;
      font-size: 14px;
      text-transform: uppercase;
    }

    td {
      color: #ddd;
    }

    .status {
      display: inline-block;
      background: rgba(245, 189, 49, 0.15);
      color: #f5bd31;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .empty-message {
      padding: 45px;
      text-align: center;
      color: #888;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .header {
        padding: 17px 20px;
      }

      .container {
        width: 92%;
        margin-top: 25px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="logo">
      ANCHOR <span>SAM</span>
    </div>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>

  </header>


  <main class="container">

    <section class="welcome">

      <h1>
        Admin <span>Dashboard</span>
      </h1>

      <p>
        Manage Anchor Sam event booking requests.
      </p>

    </section>


    <section class="cards">

      <div class="card">
        <p>Total Bookings</p>
        <h2 id="totalBookings">0</h2>
      </div>

      <div class="card">
        <p>New Bookings</p>
        <h2 id="newBookings">0</h2>
      </div>

      <div class="card">
        <p>Confirmed</p>
        <h2 id="confirmedBookings">0</h2>
      </div>

      <div class="card">
        <p>Completed</p>
        <h2 id="completedBookings">0</h2>
      </div>

    </section>


    <section class="booking-section">

      <div class="booking-header">
        <h2>Recent Bookings</h2>
      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Event</th>
              <th>Date</th>
              <th>Location</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="bookingTable">

          </tbody>

        </table>

        <div class="empty-message" id="emptyMessage">
          No bookings found.
        </div>

      </div>

    </section>

  </main>


 <script>
  const bookingTable = document.getElementById("bookingTable");
  const emptyMessage = document.getElementById("emptyMessage");

  async function loadBookings() {
    try {
      const response = await fetch("/api/admin/bookings");

      // Session expired / not logged in
      if (response.status === 401) {
        window.location.href = "/admin.html";
        return;
      }

      if (!response.ok) {
        throw new Error("Unable to load bookings");
      }

      const bookings = await response.json();

      // Dashboard counters
      document.getElementById("totalBookings").textContent =
        bookings.length;

      document.getElementById("newBookings").textContent =
        bookings.filter(
          booking =>
            !booking.status ||
            booking.status.toLowerCase() === "new"
        ).length;

      document.getElementById("confirmedBookings").textContent =
        bookings.filter(
          booking =>
            booking.status?.toLowerCase() === "confirmed"
        ).length;

      document.getElementById("completedBookings").textContent =
        bookings.filter(
          booking =>
            booking.status?.toLowerCase() === "completed"
        ).length;

      bookingTable.innerHTML = "";

      if (bookings.length === 0) {
        emptyMessage.style.display = "block";
        return;
      }

      emptyMessage.style.display = "none";

      bookings
        .slice()
        .reverse()
        .forEach((booking) => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${booking.name || "-"}</td>

            <td>
              ${booking.phone || booking.email || "-"}
            </td>

            <td>
              ${booking.eventType || booking.event || "-"}
            </td>

            <td>
              ${booking.date || booking.eventDate || "-"}
            </td>

            <td>
              ${booking.location || "-"}
            </td>

            <td>
              <span class="status">
                ${booking.status || "New"}
              </span>
            </td>

            <td>
              <button
                style="
                  background:#f5bd31;
                  color:#111;
                  border:none;
                  padding:8px 14px;
                  border-radius:6px;
                  font-weight:bold;
                  cursor:pointer;
                "
              >
                View
              </button>
            </td>
          `;

          bookingTable.appendChild(row);
        });

    } catch (error) {
      console.error(error);

      emptyMessage.style.display = "block";
      emptyMessage.textContent =
        "Unable to load bookings.";
    }
  }

  loadBookings();


  // Logout
  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      // Logout API hum next step mein connect karenge.
      window.location.href = "/admin.html";

    });
</script>
</body>
</html>
