<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anchor Sam | Admin Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */

    .header {
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #f5bd31;
    }

    .logout-btn {
      background: #f5bd31;
      color: #111;
      border: none;
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MAIN */

    .container {
      width: 90%;
      max-width: 1300px;
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome h1 span {
      color: #f5bd31;
    }

    .welcome p {
      color: #aaa;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      padding: 25px;
      border-radius: 14px;
    }

    .card p {
      color: #aaa;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f5bd31;
      font-size: 32px;
    }

    /* BOOKINGS */

    .booking-section {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
    }

    .booking-header {
      padding: 25px;
      border-bottom: 1px solid #292929;
    }

    .booking-header h2 {
      font-size: 22px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: 18px;
      border-bottom: 1px solid #292929;
    }

    th {
      color: #f5bd31;
      font-size: 14px;
      text-transform: uppercase;
    }

    td {
      color: #ddd;
    }

    .status {
      display: inline-block;
      background: rgba(245, 189, 49, 0.15);
      color: #f5bd31;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }


    .action-btn {
  border: none;
  padding: 8px 11px;
  margin: 2px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.confirm-btn {
  background: #f5bd31;
  color: #111;
}

.complete-btn {
  background: #2ecc71;
  color: #111;
}

.cancel-btn {
  background: #e74c3c;
  color: white;
}
   
    .empty-message {
      padding: 45px;
      text-align: center;
      color: #888;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .header {
        padding: 17px 20px;
      }

      .container {
        width: 92%;
        margin-top: 25px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 20px;
      }
    }
/* Wedding Gallery Upload Card */
.upload-card {
  margin: 25px 0;
  padding: 25px;
  background: linear-gradient(145deg, #171717, #0d0d0d);
  border: 1px solid rgba(245, 189, 49, 0.35);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

.upload-card h2 {
  margin: 0 0 6px;
  color: #f5bd31;
  font-size: 24px;
}

.upload-card p {
  margin: 0 0 18px;
  color: #aaa;
}

#weddingPhotoInput {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-bottom: 15px;
  background: #101010;
  color: #ddd;
  border: 1px dashed #555;
  border-radius: 10px;
}

#weddingPhotoInput::file-selector-button {
  padding: 10px 16px;
  margin-right: 12px;
  background: #252525;
  color: #f5bd31;
  border: 1px solid #f5bd31;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
}

#weddingPhotoInput::file-selector-button:hover {
  background: #f5bd31;
  color: #111;
}

.upload-btn {
  padding: 11px 22px;
  background: #f5bd31;
  color: #111;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s ease;
}

.upload-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(245, 189, 49, 0.25);
}

#uploadMessage {
  margin: 14px 0 0;
  color: #f5bd31;
  font-size: 14px;
  font-weight: 600;
}

.admin-wedding-photos {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.admin-photo-card {
  overflow: hidden;
  background: #111;
  border: 1px solid rgba(245, 189, 49, 0.35);
  border-radius: 10px;
}

.admin-photo-card img {
  width: 100%;
  height: 150px;
  display: block;
  object-fit: cover;
}

.remove-photo-btn {
  width: 100%;
  padding: 9px;
  border: 0;
  background: #c92b2b;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

@media (max-width: 600px) {
  .upload-card {
    padding: 18px;
  }

  .upload-btn {
    width: 100%;
    
.admin-wedding-photos {
  grid-template-columns: repeat(2, 1fr);
}

.admin-photo-card img {
  height: 120px;
}

}
}



  </style>
</head>

<body>

  <header class="header">

    <div class="logo">
      ANCHOR <span>SAM</span>
    </div>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>

  </header>


  <main class="container">

    <section class="welcome">

      <h1>
        Admin <span>Dashboard</span>
      </h1>

      <p>
        Manage Anchor Sam event booking requests.
      </p>

    </section>


    <section class="cards">

      <div class="card">
        <p>Total Bookings</p>
        <h2 id="totalBookings">0</h2>
      </div>

      <div class="card">
        <p>New Bookings</p>
        <h2 id="newBookings">0</h2>
      </div>

      <div class="card">
        <p>Confirmed</p>
        <h2 id="confirmedBookings">0</h2>
      </div>

      <div class="card">
        <p>Completed</p>
        <h2 id="completedBookings">0</h2>
      </div>

    </section>


    <section class="booking-section">

      <div class="booking-header">
        <h2>Recent Bookings</h2>
      </div>

      <div class="table-wrapper">


        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Event</th>
              <th>Date</th>
              <th>Location</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="bookingTable">

          </tbody>

        </table>

        <div class="empty-message" id="emptyMessage">
          No bookings found.
        </div>

      </div>

     <div class="upload-card">
  <h2>Wedding Gallery</h2>
  <p>Add photos to the Wedding event gallery</p>

  <input
    type="file"
    id="weddingPhotoInput"
    accept="image/*"
  >

  <button id="uploadWeddingPhoto" class="upload-btn">
    Upload Photo
  </button>

  <p id="uploadMessage"></p>
<div id="adminWeddingPhotos" class="admin-wedding-photos"></div>

</div>      

    </section>

  </main>


 <script>
  const bookingTable = document.getElementById("bookingTable");
  const emptyMessage = document.getElementById("emptyMessage");

  async function loadBookings() {
    try {
      const response = await fetch("/api/admin/bookings");

      // Session expired / not logged in
      if (response.status === 401) {
        window.location.href = "/admin.html";
        return;
      }

      if (!response.ok) {
        throw new Error("Unable to load bookings");
      }

      const bookings = await response.json();

      // Dashboard counters
      document.getElementById("totalBookings").textContent =
        bookings.length;

      document.getElementById("newBookings").textContent =
        bookings.filter(
          booking =>
            !booking.status ||
            booking.status.toLowerCase() === "new"
        ).length;

      document.getElementById("confirmedBookings").textContent =
        bookings.filter(
          booking =>
            booking.status?.toLowerCase() === "confirmed"
        ).length;

      document.getElementById("completedBookings").textContent =
        bookings.filter(
          booking =>
            booking.status?.toLowerCase() === "completed"
        ).length;

      bookingTable.innerHTML = "";

      if (bookings.length === 0) {
        emptyMessage.style.display = "block";
        return;
      }

      emptyMessage.style.display = "none";

      bookings
        .slice()
        .reverse()
        .forEach((booking) => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${booking.name || "-"}</td>

            <td>
              ${booking.phone || booking.email || "-"}
            </td>

            <td>
              ${booking.eventType || booking.event || "-"}
            </td>

            <td>
              ${booking.date || booking.eventDate || "-"}
            </td>

            <td>
              ${booking.location || "-"}
            </td>

            <td>
              <span class="status">
                ${booking.status || "New"}
              </span>
            </td>

          <td>
  <button
    class="action-btn confirm-btn"
    onclick="updateStatus('${booking._id}', 'Confirmed')"
  >
    Confirm
  </button>

  <button
    class="action-btn complete-btn"
    onclick="updateStatus('${booking._id}', 'Completed')"
  >
    Complete
  </button>

  <button
    class="action-btn cancel-btn"
    onclick="updateStatus('${booking._id}', 'Cancelled')"
  >
    Cancel
  </button>
</td>
          `;

          bookingTable.appendChild(row);
        });

    } catch (error) {
      console.error(error);

      emptyMessage.style.display = "block";
      emptyMessage.textContent =
        "Unable to load bookings.";
    }
  }

async function updateStatus(bookingId, status) {
  try {
    const response = await fetch(
      `/api/admin/bookings/${bookingId}/status`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status })
      }
    );

    if (response.status === 401) {
      window.location.href = "/admin.html";
      return;
    }

    if (!response.ok) {
      throw new Error("Unable to update status");
    }

    // Reload dashboard with updated status
    await loadBookings();

  } catch (error) {
    console.error(error);
    alert("Unable to update booking status.");
  }
}



  loadBookings();


  // Logout
  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      // Logout API hum next step mein connect karenge.
      window.location.href = "/admin.html";

    });
  
    document
  .getElementById("uploadWeddingPhoto")
  .addEventListener("click", async () => {

    const input = document.getElementById("weddingPhotoInput");
    const message = document.getElementById("uploadMessage");

    if (!input.files[0]) {
      message.textContent = "Please select a photo first.";
      return;
    }

    const formData = new FormData();
    formData.append("photo", input.files[0]);

    message.textContent = "Uploading...";

    try {
      const response = await fetch("/api/admin/wedding-photos", {
        method: "POST",
        body: formData
      });

      if (response.status === 401) {
        window.location.href = "/admin.html";
        return;
      }

      const data = await response.json();

      if (!response.ok) {
        message.textContent = data.message || "Upload failed.";
        return;
      }

      message.textContent = "Photo uploaded successfully! ✅";
      input.value = "";

    } catch (error) {
      console.error(error);
      message.textContent = "Unable to upload photo.";
    }
  });

async function loadAdminWeddingPhotos() {
  const container = document.getElementById("adminWeddingPhotos");

  try {
    const response = await fetch("/api/wedding-photos");
    const photos = await response.json();

    container.innerHTML = "";

    photos.forEach((photo) => {
      const card = document.createElement("div");
      card.className = "admin-photo-card";

      const img = document.createElement("img");
      img.src = photo.imageUrl;
      img.alt = "Wedding Photo";

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-photo-btn";
      removeBtn.textContent = "Remove";

      removeBtn.addEventListener("click", () => {
        deleteWeddingPhoto(photo._id);
      });

      card.appendChild(img);
      card.appendChild(removeBtn);
      container.appendChild(card);
    });

  } catch (error) {
    console.error("Unable to load wedding photos:", error);
  }
}


async function deleteWeddingPhoto(photoId) {
  const confirmDelete = confirm(
    "Are you sure you want to remove this photo?"
  );

  if (!confirmDelete) return;

  try {
    const response = await fetch(
      `/api/admin/wedding-photos/${photoId}`,
      {
        method: "DELETE"
      }
    );

    if (response.status === 401) {
      window.location.href = "/admin.html";
      return;
    }

    const data = await response.json();

    if (!response.ok) {
      alert(data.message || "Unable to delete photo.");
      return;
    }

    await loadAdminWeddingPhotos();

  } catch (error) {
    console.error(error);
    alert("Unable to delete photo.");
  }
}

loadAdminWeddingPhotos();

</script>
</body>
</html>
